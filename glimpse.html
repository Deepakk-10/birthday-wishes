<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>glimpses of Her</title>

    <link rel="stylesheet" href="glimpse.css">
</head>
<body>

    <!-- ✨ Decorative Background -->

<div class="swirl"></div>
<div class="swirl"></div>
<div class="swirl"></div>
<div class="swirl"></div>

<div class="shiny-dot" style="left:8%; top:18%; animation-delay:.2s;"></div>
<div class="shiny-dot" style="left:23%; top:42%; animation-delay:1s;"></div>
<div class="shiny-dot" style="left:38%; top:12%; animation-delay:.5s;"></div>
<div class="shiny-dot" style="left:62%; top:28%; animation-delay:1.4s;"></div>
<div class="shiny-dot" style="left:78%; top:15%; animation-delay:.7s;"></div>
<div class="shiny-dot" style="left:91%; top:48%; animation-delay:1.8s;"></div>
<div class="shiny-dot" style="left:12%; top:72%; animation-delay:1.2s;"></div>
<div class="shiny-dot" style="left:87%; top:78%; animation-delay:.4s;"></div>

<div class="sparkle" style="left:15%; top:30%;"></div>
<div class="sparkle" style="left:82%; top:25%; animation-delay:.8s;"></div>
<div class="sparkle" style="left:30%; top:80%; animation-delay:1.2s;"></div>
<div class="sparkle" style="left:72%; top:70%; animation-delay:.4s;"></div>

<div class="floating-heart" style="left:10%; animation-duration:9s;">♥</div>
<div class="floating-heart" style="left:30%; animation-duration:12s; animation-delay:2s;">♡</div>
<div class="floating-heart" style="left:55%; animation-duration:10s; animation-delay:4s;">♥</div>

    <!-- Heading -->
    <img
        src="glimpse-of-you.png.png"
        class="glimpse-heading"
        alt="Glimpse of You"
    >


    <!-- Camera Button -->
    <button class="camera-button" id="cameraButton">

        <span class="camera-icon">📷</span>

        <span class="camera-text">
            Click Me
        </span>

    </button>


    <!-- Photos -->
    <div class="photo-stack" id="photoStack">

    <div class="photo-card">
        <img src="khph01.jpg" alt="Memory 1">
    </div>

    <div class="photo-card">

    </div>

        <img src="khph08.jpg" alt="Memory 4">
    </div>
     
    <!-- Swipe hint -->

<div class="swipe-hint" id="swipeHint">

    <div class="swipe-arrow">→</div>

        Swipe to see more
    </div>

</div>
     
</div>

</button>
